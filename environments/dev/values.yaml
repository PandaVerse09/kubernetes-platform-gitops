# Environment overrides for DEV (Local KIND Cluster)
replicaCount: 2

image:
  repository: kubernetes-platform-app
  tag: "1.0.0"
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: app.local
      paths:
        - path: /
          pathType: Prefix
    - host: localhost
      paths:
        - path: /
          pathType: Prefix
    - host: 127.0.0.1
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

serviceMonitor:
  enabled: true

env:
  NODE_ENV: "development"
  APP_VERSION: "dev-latest"

secrets:
  API_KEY: "dev-local-secret-key-12345"
