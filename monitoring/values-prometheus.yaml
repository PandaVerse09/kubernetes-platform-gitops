# Custom values for kube-prometheus-stack
# Helm repository: https://prometheus-community.github.io/helm-charts

defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false
    k8s: true
    kubeApiserver: true
    kubePrometheusNodeAlerting: true
    kubernetesApps: true
    kubernetesResources: true
    node: true

alertmanager:
  enabled: true

grafana:
  enabled: true
  adminPassword: "prom-operator"
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.local
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    podMonitorSelector: {}
    ruleSelector: {}
    scrapeInterval: "15s"
    evaluationInterval: "15s"
    retention: 7d
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
