{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubernetes-platform-app.fullname" . }}
  labels:
    {{- include "kubernetes-platform-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubernetes-platform-app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic on port 8080 from within the cluster (Ingress controller, Prometheus scraper)
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS resolution (UDP/TCP 53)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS outbound if needed for external APIs
    - to: []
      ports:
        - protocol: TCP
          port: 443
{{- end }}
